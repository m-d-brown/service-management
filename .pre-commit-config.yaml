# ==============================================================================
# PRE-COMMIT CONFIGURATION
# ==============================================================================
# This file dictates what checks run locally on your machine before a commit
# is finalized. By catching issues early, we keep our CI pipeline fast and green.
#
# To manually run these checks on all files, use:
#   task check
#
# To bypass these checks during an emergency commit, use:
#   git commit --no-verify
# ==============================================================================

repos:
  # ----------------------------------------------------------------------------
  # GENERIC FILE CHECKS
  # ----------------------------------------------------------------------------
  # These hooks catch basic whitespace and syntax issues across all file types.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Removes trailing whitespaces at the ends of lines.
      - id: trailing-whitespace
      # Ensures that every file ends with exactly one newline.
      - id: end-of-file-fixer
      # Validates YAML syntax to prevent broken CI configurations.
      - id: check-yaml
      # Prevents accidental commits of giant files (e.g., binaries, large datasets).
      - id: check-added-large-files

  # ----------------------------------------------------------------------------
  # LANGUAGE LINTERS, FORMATTERS & TYPE CHECKERS
  # ----------------------------------------------------------------------------
  # These are local (language: system) hooks that invoke the project's own
  # toolchain rather than pre-commit-managed mirrors. This guarantees a single
  # source of truth for tool versions: Go tools come from go.mod / mise, and
  # Python tools (ruff, mypy) come from uv.lock via `uv run`. Without this, a
  # pre-commit mirror could pin a different version than the project uses and
  # the two would silently disagree.
  - repo: local
    hooks:
      # golangci-lint runs dozens of Go checks at once. It operates on the
      # whole module, so we cd into go/ and disable per-file invocation.
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd go && golangci-lint run ./...'
        language: system
        types: [go]
        pass_filenames: false

      # Ruff (lint + autofix), pinned by uv.lock. Run from the package dir so
      # uv resolves the member's dev dependency group.
      - id: ruff-check
        name: ruff check
        entry:
          bash -c 'cd python/reboot-orchestrator && uv run ruff check --fix src/
          tests/'
        language: system
        types: [python]
        pass_filenames: false

      # Ruff formatter (replaces black), pinned by uv.lock.
      - id: ruff-format
        name: ruff format
        entry:
          bash -c 'cd python/reboot-orchestrator && uv run ruff format src/
          tests/'
        language: system
        types: [python]
        pass_filenames: false

      # mypy static type checking against the real (uv-synced) dependencies,
      # pinned by uv.lock.
      - id: mypy
        name: mypy
        entry:
          bash -c 'cd python/reboot-orchestrator && uv run mypy
          --ignore-missing-imports src/ tests/'
        language: system
        types: [python]
        pass_filenames: false

  # ----------------------------------------------------------------------------
  # MARKDOWN LINTING
  # ----------------------------------------------------------------------------
  # markdownlint checks markdown files for style, structure, and syntax issues.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint

  # ----------------------------------------------------------------------------
  # MARKDOWN & CONFIG FORMATTING
  # ----------------------------------------------------------------------------
  # Prettier is an opinionated code formatter that keeps our Markdown and YAML
  # files consistently structured and readable.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # We only want prettier to format markdown and yaml.
        types_or: [markdown, yaml]
        # --prose-wrap=always forces Prettier to automatically wrap markdown paragraphs
        # (prose) at 80 characters, keeping files clean and readable. We disable MD013
        # in .markdownlint.yaml to prevent conflicts on long URLs, code blocks, or tables.
        args: ["--prose-wrap=always"]

  # ----------------------------------------------------------------------------
  # SECRET SCANNING
  # ----------------------------------------------------------------------------
  # Gitleaks detects hardcoded secrets like passwords, api keys, and tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
