[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reboot-orchestrator"
version = "0.1.0"
description = "Simple reboot orchestration tool"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.0"
]

[project.scripts]
reboot-orchestrator = "reboot_orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12.20240311"
]
