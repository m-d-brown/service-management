# ==============================================================================
# CONTINUOUS INTEGRATION (CI) WORKFLOW
# ==============================================================================
# This workflow acts as the final gatekeeper for our repository health.
# It runs automatically on every pull request to 'main' and any direct pushes
# to 'main'.
#
# If a step fails here, it usually means someone bypassed the local `task setup`
# or committed using `git commit --no-verify`.
#
# VERSION MANAGEMENT:
#   - Go version: sourced from go/go.mod (single source of truth)
#   - Python version: sourced from .python-version (single source of truth)
#   - CLI tools (uv, task, golangci-lint): sourced from mise.toml (single
#     source of truth, shared with local development via mise)
#   - GitHub Action versions: kept current by Dependabot (see .github/dependabot.yml)

name: CI

on:
  # Run when code is merged or pushed directly to the main branch
  push:
    branches: [main]
  # Run when a Pull Request targets the main branch
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: LINTING & FORMATTING
  # ----------------------------------------------------------------------------
  # This job replicates the local `pre-commit` environment. If a file violates
  # our formatting or linting rules, this job will fail the CI pipeline.
  #
  # We use `task check` to mirror the exact developer experience locally.
  check:
    name: Check (Format, Lint, Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pre-commit hooks require Go to be installed (for golangci-lint)
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the Go version from go.mod so we never drift between
          # local development and CI.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # actions/setup-go sets GOTOOLCHAIN=local, which prevents pre-commit
      # hooks that use `language: golang` (e.g., gitleaks) from auto-downloading
      # a newer Go toolchain when their own go.mod requires one. Unsetting it
      # restores Go's default behavior.
      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      # Pre-commit itself and Ruff/Mypy require Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Read the Python version from .python-version so it stays in
          # sync with pyenv and local tooling automatically.
          python-version-file: .python-version

      # Install the auxiliary CLI tools (uv, task, golangci-lint) from
      # mise.toml. This is the same file developers use locally, so CI and
      # local environments install identical tools and cannot drift. uv drives
      # the Python tooling, task is our command runner, and golangci-lint is
      # required on PATH by the pre-commit hook (language: system).
      - name: Install tools via mise
        uses: jdx/mise-action@v4

      # Pre-commit must be installed in the CI environment via pip
      - name: Install pre-commit
        run: pip install pre-commit

      # Mirror the local developer workflow: `task check` runs
      # `pre-commit run --all-files` under the hood.
      - name: Run Checks
        run: task check

  # ----------------------------------------------------------------------------
  # JOB 2: TESTS
  # ----------------------------------------------------------------------------
  # This job executes the automated unit tests for all languages via
  # `task test` (Go and Python), mirroring the local developer command.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # Python is needed for the Python test suite (uv run pytest).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Install task and uv (and the rest of mise.toml) so CI uses the same
      # runner and toolchain as local development.
      - name: Install tools via mise
        uses: jdx/mise-action@v4

      # Run the full test suite (Go + Python). go.mod tidiness is verified by
      # the check job via `task check`.
      - name: Run tests
        run: task test
