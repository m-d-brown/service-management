[project]
name = "service-management"
version = "0.1.0"
description = "A collection of tools and libraries for managing infrastructure services"
requires-python = ">=3.10"

[tool.uv]
package = false
# No Python packages at present: the tools in this repository are Go. Python
# stays provisioned because the lint toolchain (pre-commit, and the ruff and
# mypy hooks it would drive) is written in it, so a future Python package needs
# only a workspace member added back here.
workspace = { members = [] }
