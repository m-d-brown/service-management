version: "3"

tasks:
  build:
    desc: Build all Go tools
    cmds:
      - task: go:build

  test:
    desc: Run all tests
    cmds:
      - task: go:test

  tidy:
    desc: Tidy all modules
    cmds:
      - task: go:tidy

  go:build:
    dir: go
    cmds:
      - task: build

  go:test:
    dir: go
    cmds:
      - task: test

  go:tidy:
    dir: go
    cmds:
      - task: tidy

  go:install:
    dir: go
    cmds:
      - task: install
