version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Bootstrap the repository (sync deps and install git hooks)
    cmds:
      - uv sync
      - pre-commit install

  build:
    desc: Build all binaries
    cmds:
      - go -C go build -o bin/container-version-snapshot
        ./cmd/container-version-snapshot
      - go -C go build -o bin/update-container-manifest
        ./cmd/update-container-manifest

  install:
    desc: Install binaries to GOBIN
    cmds:
      - go -C go install ./cmd/container-version-snapshot
      - go -C go install ./cmd/update-container-manifest

  test:
    desc: Run all tests (Go and Python)
    cmds:
      - go -C go test -v ./...
      - uv run --directory python/reboot-orchestrator pytest tests/

  check:
    desc: Lint, format-check, type-check, and scan all files
    cmds:
      # pre-commit drives the language linters/formatters/type-checkers and
      # the generic file, markdown, and secret hooks.
      - pre-commit run --all-files
      # Verify go.mod / go.sum are tidy (fails if `task tidy` would change them).
      - go -C go mod tidy
      - git diff --exit-code go/go.mod go/go.sum

  format:
    desc: Auto-format and fix all source files
    cmds:
      - go -C go fmt ./...
      - uv run --directory python/reboot-orchestrator ruff check --fix src/
        tests/
      - uv run --directory python/reboot-orchestrator ruff format src/ tests/

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go -C go mod tidy
