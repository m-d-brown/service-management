version: "3"

# ----------------------------------------------------------------------------
# INCLUDES
# ----------------------------------------------------------------------------
# We include the go/Taskfile.yml under the "go" namespace. This means all
# tasks defined in go/Taskfile.yml are available here as "go:<task-name>"
# (e.g., go:test, go:build). The 'dir' option ensures commands run from
# the go/ subdirectory where go.mod lives.
includes:
  go:
    taskfile: go/Taskfile.yml
    dir: go
  python:
    taskfile: python/reboot-orchestrator/Taskfile.yml
    dir: python/reboot-orchestrator

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Bootstrap the repository (install git hooks and pre-commit)
    cmds:
      - uv sync
      - pre-commit install

  build:
    desc: Build all Go tools
    cmds:
      - task: go:build

  test:
    desc: Run all tests
    cmds:
      - task: go:test
      - task: python:test

  tidy:
    desc: Tidy all modules
    cmds:
      - task: go:tidy

  check:
    desc: Format, lint, type-check, and scan all files
    aliases: [lint, fmt]
    cmds:
      - pre-commit run --all-files
      - task: go:tidy:check
      - task: python:check
